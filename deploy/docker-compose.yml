services:
  # Frontend SPA. No longer exposed to Traefik directly — oauth2-proxy is the
  # public entrypoint for excalidraw.bizelevateai.com and proxies here only
  # after a successful Google sign-in. Reached internally by service-name DNS.
  excalidraw-frontend:
    build:
      context: ..
      dockerfile: Dockerfile
    labels:
      - "traefik.enable=false"
    expose:
      - "80"
    networks:
      - root_default
    restart: unless-stopped

  # Google OAuth gatekeeper, running as a reverse proxy in front of the SPA.
  # Unauthenticated browser requests get a native 302 to Google; authenticated
  # ones are proxied to excalidraw-frontend. /oauth2/* is handled internally.
  oauth2-proxy:
    image: quay.io/oauth2-proxy/oauth2-proxy:v7.6.0
    env_file:
      - ./oauth2-proxy.env
    environment:
      OAUTH2_PROXY_PROVIDER: google
      OAUTH2_PROXY_EMAIL_DOMAINS: bizelevate.net
      OAUTH2_PROXY_REDIRECT_URL: https://excalidraw.bizelevateai.com/oauth2/callback
      OAUTH2_PROXY_COOKIE_DOMAINS: excalidraw.bizelevateai.com
      OAUTH2_PROXY_WHITELIST_DOMAINS: excalidraw.bizelevateai.com
      OAUTH2_PROXY_HTTP_ADDRESS: 0.0.0.0:4180
      OAUTH2_PROXY_REVERSE_PROXY: "true"
      OAUTH2_PROXY_UPSTREAMS: http://excalidraw-frontend:80
      OAUTH2_PROXY_COOKIE_SECURE: "true"
      OAUTH2_PROXY_SKIP_PROVIDER_BUTTON: "true"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.excalidraw.entrypoints=websecure"
      - "traefik.http.routers.excalidraw.rule=Host(`excalidraw.bizelevateai.com`)"
      - "traefik.http.routers.excalidraw.tls=true"
      - "traefik.http.routers.excalidraw.tls.certresolver=mytlschallenge"
      - "traefik.http.services.excalidraw.loadbalancer.server.port=4180"
    networks:
      - root_default
    restart: unless-stopped
    depends_on:
      - excalidraw-frontend

  excalidraw-room:
    image: excalidraw/excalidraw-room:latest
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.excalidraw-collab.entrypoints=websecure"
      - "traefik.http.routers.excalidraw-collab.rule=Host(`excalidraw-collab.bizelevateai.com`)"
      - "traefik.http.routers.excalidraw-collab.tls=true"
      - "traefik.http.routers.excalidraw-collab.tls.certresolver=mytlschallenge"
      - "traefik.http.services.excalidraw-collab.loadbalancer.server.port=80"
    networks:
      - root_default
    restart: unless-stopped

  excalidraw-storage:
    image: alswl/excalidraw-storage-backend:v2023.11.11
    environment:
      PORT: "8080"
      GLOBAL_PREFIX: /api/v2
      STORAGE_URI: redis://redis:6379
      BODY_LIMIT: 50mb
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.excalidraw-storage.entrypoints=websecure"
      - "traefik.http.routers.excalidraw-storage.rule=Host(`excalidraw-storage.bizelevateai.com`)"
      - "traefik.http.routers.excalidraw-storage.tls=true"
      - "traefik.http.routers.excalidraw-storage.tls.certresolver=mytlschallenge"
      - "traefik.http.routers.excalidraw-storage.middlewares=excalidraw-storage-cors"
      - "traefik.http.middlewares.excalidraw-storage-cors.headers.accesscontrolalloworiginlist=https://excalidraw.bizelevateai.com"
      - "traefik.http.middlewares.excalidraw-storage-cors.headers.accesscontrolallowmethods=GET,POST,PUT,OPTIONS"
      - "traefik.http.middlewares.excalidraw-storage-cors.headers.accesscontrolallowheaders=*"
      - "traefik.http.middlewares.excalidraw-storage-cors.headers.accesscontrolmaxage=100"
      - "traefik.http.middlewares.excalidraw-storage-cors.headers.addvaryheader=true"
      - "traefik.http.services.excalidraw-storage.loadbalancer.server.port=8080"
    networks:
      - root_default
    restart: unless-stopped
    depends_on:
      - redis

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    volumes:
      - redis-data:/data
    networks:
      - root_default
    restart: unless-stopped

volumes:
  redis-data:

networks:
  root_default:
    external: true
